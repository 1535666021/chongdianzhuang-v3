name: Doc Size Guard

on:
  push:
    paths:
      - '.monkeycode/**.md'
      - '.github/workflows/doc-size-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check monkeycode markdown sizes
        run: |
          set -e
          SOFT=16384
          HARD=28672
          status=0
          for f in .monkeycode/*.md; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            echo "$f $size bytes"
            if [ "$size" -gt "$HARD" ]; then
              echo "::error file=$f::$f over HARD limit ($size > $HARD)"
              status=1
            elif [ "$size" -gt "$SOFT" ]; then
              echo "::warning file=$f::$f over SOFT distillation threshold ($size > $SOFT)"
            fi
          done
          exit $status
